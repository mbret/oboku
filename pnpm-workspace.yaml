packages:
  - packages/*
  - apps/*
catalog:
  react: 19.2.8
  react-dom: 19.2.8
# apps/web/tsconfig.json redirects @internationalized/* to
# ../../node_modules/@internationalized/*/dist/types — keep that scope
# physically hoisted at the root like npm used to.
publicHoistPattern:
  - '@internationalized/*'
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': false
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  aws-sdk: false
  bcrypt: true
  esbuild: true
  nx: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
patchedDependencies:
  react-dom@19.2.8: patches/react-dom@19.2.8.patch
# gesturx has the same author as prose-reader. Its entries name an exact
# version, the one @prose-reader/enhancer-gestures requires, and each does
# nothing once that version is a day old.
minimumReleaseAgeExclude:
  - '@prose-reader/*'
  - gesturx@1.11.1
