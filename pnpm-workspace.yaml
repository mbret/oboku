packages:
  - packages/*
  - apps/*
catalog:
  react: 19.2.8
  react-dom: 19.2.8
# apps/web/tsconfig.json redirects @internationalized/* to
# ../../node_modules/@internationalized/*/dist/types — keep that scope
# physically hoisted at the root like npm used to.
publicHoistPattern:
  - '@internationalized/*'
allowBuilds:
  '@firebase/util': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  aws-sdk: false
  bcrypt: true
  esbuild: true
  nx: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
patchedDependencies:
  react-dom@19.2.8: patches/react-dom@19.2.8.patch
minimumReleaseAgeExclude:
  - '@prose-reader/archive-reader@1.344.0'
  - '@prose-reader/cbz@1.344.0'
  - '@prose-reader/cfi@1.344.0'
  - '@prose-reader/core@1.344.0'
  - '@prose-reader/enhancer-audio@1.344.0'
  - '@prose-reader/enhancer-gallery@1.344.0'
  - '@prose-reader/enhancer-gestures@1.344.0'
  - '@prose-reader/enhancer-pdf@1.344.0'
  - '@prose-reader/enhancer-refit@1.344.0'
  - '@prose-reader/enhancer-search@1.344.0'
  - '@prose-reader/react-reader@1.344.0'
  - '@prose-reader/shared@1.344.0'
  - '@prose-reader/streamer@1.344.0'
