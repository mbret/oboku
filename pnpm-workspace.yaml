packages:
  - packages/*
  - apps/*
catalog:
  react: 19.3.1
  react-dom: 19.3.1
catalogs:
  # react-reader declares reactjrx as a peer, and enhancer-gestures gesturx, so
  # both move with the prose-reader packages.
  prose-reader:
    "@prose-reader/archive-reader": ^46.0.0
    "@prose-reader/cbz": ^46.1.0
    "@prose-reader/core": ^46.1.0
    "@prose-reader/enhancer-annotations": ^46.1.0
    "@prose-reader/enhancer-audio": ^46.1.0
    "@prose-reader/enhancer-gallery": ^46.1.0
    "@prose-reader/enhancer-gestures": ^46.1.0
    "@prose-reader/enhancer-koreader": ^46.1.0
    "@prose-reader/enhancer-pdf": ^46.1.0
    "@prose-reader/enhancer-refit": ^46.1.0
    "@prose-reader/enhancer-search": ^46.1.0
    "@prose-reader/koreader": ^46.0.0
    "@prose-reader/metadata-fetcher": ^46.0.0
    "@prose-reader/react-reader": ^46.1.0
    "@prose-reader/shared": ^46.0.0
    "@prose-reader/streamer": ^46.0.0
    gesturx: ^8.0.1
    reactjrx: ^7.0.0
# apps/web/tsconfig.json redirects @internationalized/* to
# ../../node_modules/@internationalized/*/dist/types — keep that scope
# physically hoisted at the root like npm used to.
publicHoistPattern:
  - "@internationalized/*"
allowBuilds:
  "@firebase/util": true
  "@scarf/scarf": false
  "@sentry/node-cpu-profiler": true
  "@swc/core": true
  aws-sdk: false
  bcrypt: true
  esbuild: true
  koffi: false
  nx: true
  protobufjs: false
  sharp: true
patchedDependencies:
  react-dom@19.3.1: patches/react-dom@19.3.1.patch
  # webdav 5.11.0 bug (mbret/oboku#845): when the client uses Digest auth,
  # handleResponseCode returns a 401 response and does not throw. A request
  # with a wrong password then fails with a parse error, and a download
  # returns the 401 page as the book. The patch deletes that early return in
  # the Node and browser builds. Remove the patch when a webdav release fixes
  # source/response.ts.
  webdav@5.11.0: patches/webdav@5.11.0.patch
# prose-reader, gesturx and reactjrx share oboku's maintainer, so their
# releases are installed as soon as they are out.
minimumReleaseAgeExclude:
  - "@prose-reader/*"
  - gesturx
  - reactjrx
