packages:
  - packages/*
  - apps/*
catalog:
  react: 19.3.0
  react-dom: 19.3.0
# apps/web/tsconfig.json redirects @internationalized/* to
# ../../node_modules/@internationalized/*/dist/types — keep that scope
# physically hoisted at the root like npm used to.
publicHoistPattern:
  - '@internationalized/*'
allowBuilds:
  '@firebase/util': true
  '@scarf/scarf': false
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  aws-sdk: false
  bcrypt: true
  esbuild: true
  nx: true
  protobufjs: false
  sharp: true
patchedDependencies:
  react-dom@19.3.0: patches/react-dom@19.3.0.patch
# prose-reader shares oboku's maintainer, so its releases are installed as
# soon as they are out.
minimumReleaseAgeExclude:
  - '@prose-reader/*'
