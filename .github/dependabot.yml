version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "01:00"
    open-pull-requests-limit: 5
    ignore:
      # Stays on v9 until @semantic-release/release-notes-generator renders
      # with conventional-changelog-writer 9: see release.config.mjs.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
      # Follows the major of the Node runtime pinned in .nvmrc, the CI and the
      # dockerfile, not the latest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Has to equal the Dexie that rxdb pins, which
      # scripts/check-dexie-version.mjs enforces on install, so it only moves
      # together with rxdb.
      - dependency-name: dexie
      # babel-plugin-react-compiler 1.0.0 is built on @babel/types 7. With
      # Babel 8 it skips about a sixth of the web app's functions without a
      # warning, so Babel moves to 8 with a compiler release that supports it.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "01:00"
