name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

env:
  BUBBLEWRAP_CLI: "@bubblewrap/cli@1.27.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Bubblewrap
        run: |
          # Bubblewrap 1.27.0 requires <sdk>/bin or <sdk>/tools
          # (AndroidSdkTools.validatePath) and runs sdkmanager from there
          # (installBuildTools). The runner has sdkmanager in
          # <sdk>/cmdline-tools/latest/bin.
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          mkdir -p ~/.bubblewrap
          jq -n --arg jdkPath "$JAVA_HOME" --arg androidSdkPath "$ANDROID_HOME" \
            '{ jdkPath: $jdkPath, androidSdkPath: $androidSdkPath }' > ~/.bubblewrap/config.json

      - name: Generate the Android project
        run: pnpm dlx "$BUBBLEWRAP_CLI" update --skipVersionUpgrade --manifest=twa-manifest.json --directory=dist

      - name: Build unsigned
        working-directory: apps/android/dist
        run: pnpm dlx "$BUBBLEWRAP_CLI" build --skipSigning --manifest=../twa-manifest.json

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: android-unsigned
          path: |
            apps/android/dist/app-release-unsigned-aligned.apk
            apps/android/dist/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1
          if-no-files-found: error

  # Holds the upload key: no checkout, no npm package, and its own runner,
  # because npm code in build can rewrite build's world-writable SDK tools.
  sign:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-unsigned

      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/android.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${build_tools}apksigner" sign \
            --ks "$keystore" --ks-key-alias android \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out app-release-signed.apk app-release-unsigned-aligned.apk
          "$JAVA_HOME/bin/jarsigner" -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD \
            -signedjar app-release-bundle.aab app/build/outputs/bundle/release/app-release.aab android
          rm "$keystore"

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            app-release-bundle.aab
            app-release-signed.apk
          if-no-files-found: error
