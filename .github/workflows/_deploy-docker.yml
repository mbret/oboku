name: deploy-docker

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit to build the images from'
        required: true
        type: string
      tags:
        description: 'Tags to push every image under, one per line (e.g. latest)'
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  deploy:
    name: 'Deploy ${{ matrix.target }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, couchdb, web, admin]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          IMAGE: mbret/oboku-${{ matrix.target }}
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo 'tags<<EOF'
            for tag in $TAGS; do
              echo "$IMAGE:$tag"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: ${{ matrix.target }}
          build-args: |
            GITHUB_SHA=${{ inputs.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
