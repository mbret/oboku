name: e2e

on:
  pull_request:
    paths-ignore:
      - "apps/admin/**"
      - "apps/android/**"
      - "apps/docs/**"
      - "apps/landing/**"
      - ".agents/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @oboku/e2e exec playwright install --with-deps --only-shell chromium
      - name: Start the stack
        run: pnpm --filter @oboku/e2e stack:up
      - name: Type-check
        run: pnpm exec lerna run tsc --scope=@oboku/e2e
      - name: Run the smoke tests
        run: pnpm e2e
      - name: Print the stack logs
        if: failure()
        run: docker compose -f apps/e2e/docker-compose.yml logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
