name: Build, test and deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Check
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build
          pnpm run test

  release:
    name: 'Release'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.released.outputs.version }}
      sha: ${{ steps.released.outputs.sha }}
      sha_tag: ${{ steps.released.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec semantic-release

      - id: released
        run: |
          {
            echo "version=$(jq -r .version package.json)"
            echo "sha=$(git rev-parse HEAD)"
            echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

  deploy-docker:
    name: 'Deploy docker'
    needs: [build-and-test, release]
    uses: ./.github/workflows/_deploy-docker.yml
    with:
      sha: ${{ needs.release.outputs.sha }}
      tags: |
        latest
        ${{ needs.release.outputs.version }}
        ${{ needs.release.outputs.sha_tag }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-web-vercel:
    name: 'Deploy web vercel'
    needs: [build-and-test, release]
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app_directory: 'apps/web'
      deployment_name: 'web production'
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-landing-vercel:
    name: 'Deploy landing vercel'
    needs: [build-and-test]
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app_directory: 'apps/landing'
      deployment_name: 'landing production'
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LANDING_PROJECT_ID }}
