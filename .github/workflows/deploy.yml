name: Build, test and deploy

on:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Check
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build
          pnpm run test

  deploy-api-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mbret/oboku-api:latest

  deploy-couchdb-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push CouchDB
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: couchdb
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mbret/oboku-couchdb:latest

  deploy-web-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mbret/oboku-web:latest

  deploy-admin-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: mbret/oboku-admin:latest

  publish-release:
    name: 'Publish release'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: 'Publish GitHub release for the root version'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"
          tag="v$version"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi

          upgrade_notes="$(mktemp)"
          awk -v heading="## $version" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture
          ' gitbook/self-hosting/changelog.md > "$upgrade_notes"

          notes_args=()
          if [ -s "$upgrade_notes" ]; then
            notes_args=(--notes-file "$upgrade_notes")
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            "${notes_args[@]}"

  bump-web-version:
    name: 'Bump Version'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout source code'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: 'cat package.json'
        run: cat ./package.json
      - name: 'Automated Version Bump'
        id: version-bump
        uses: 'phips28/gh-action-bump-version@v10.1.1'
        with:
          tag-prefix: 'web-'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGEJSON_DIR: 'apps/web'
      - name: 'cat package.json'
        run: cat ./package.json
      - name: 'Output Step'
        env:
          NEW_TAG: ${{ steps.version-bump.outputs.newTag }}
        run: echo "new tag $NEW_TAG"

  deploy-web-vercel:
    name: 'Deploy web vercel'
    needs: [bump-web-version]
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app_directory: 'apps/web'
      deployment_name: 'web production'
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-landing-vercel:
    name: 'Deploy landing vercel'
    needs: [build-and-test]
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app_directory: 'apps/landing'
      deployment_name: 'landing production'
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LANDING_PROJECT_ID }}
