name: Build, test and deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Check
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build
          pnpm run test

  release:
    name: 'Release'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.released.outputs.version }}
      sha: ${{ steps.released.outputs.sha }}
      sha_tag: ${{ steps.released.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec semantic-release

      - id: released
        run: |
          {
            echo "version=$(jq -r .version package.json)"
            echo "sha=$(git rev-parse HEAD)"
            echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

  deploy-api-docker:
    needs: [build-and-test, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mbret/oboku-api:latest
            mbret/oboku-api:${{ needs.release.outputs.version }}
            mbret/oboku-api:${{ needs.release.outputs.sha_tag }}

  deploy-couchdb-docker:
    needs: [build-and-test, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push CouchDB
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: couchdb
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mbret/oboku-couchdb:latest
            mbret/oboku-couchdb:${{ needs.release.outputs.version }}
            mbret/oboku-couchdb:${{ needs.release.outputs.sha_tag }}

  deploy-web-docker:
    needs: [build-and-test, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mbret/oboku-web:latest
            mbret/oboku-web:${{ needs.release.outputs.version }}
            mbret/oboku-web:${{ needs.release.outputs.sha_tag }}

  deploy-admin-docker:
    needs: [build-and-test, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: dockerfile
          target: admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mbret/oboku-admin:latest
            mbret/oboku-admin:${{ needs.release.outputs.version }}
            mbret/oboku-admin:${{ needs.release.outputs.sha_tag }}

  deploy-web-vercel:
    name: 'Deploy web vercel'
    needs: [build-and-test, release]
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app_directory: 'apps/web'
      deployment_name: 'web production'
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-landing-vercel:
    name: 'Deploy landing vercel'
    needs: [build-and-test]
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      app_directory: 'apps/landing'
      deployment_name: 'landing production'
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LANDING_PROJECT_ID }}
