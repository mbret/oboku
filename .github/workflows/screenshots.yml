name: screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    # The reader renders book text with the runner's system fonts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @oboku/e2e exec playwright install --with-deps --only-shell chromium
      - name: Start the stack
        run: pnpm --filter @oboku/e2e stack:up
      - name: Capture the screenshots
        run: pnpm screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: play-store-screenshots
          path: apps/e2e/screenshots/play-phone
          if-no-files-found: error
      - name: Open a pull request with the new web manifest images
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp apps/e2e/screenshots/web-manifest/*.png apps/web/public/
          if [ -z "$(git status --porcelain -- apps/web/public)" ]; then
            echo "The web manifest images did not change."
            exit 0
          fi
          branch="screenshots/web-manifest-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/web/public
          git commit -m "chore(web): update the web manifest screenshots"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "chore(web): update the web manifest screenshots" \
            --body "The screenshots workflow captured new web manifest images in $RUN_URL."
      - name: Print the stack logs
        if: failure()
        run: docker compose -f apps/e2e/docker-compose.yml logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
