name: check

on:
  push:
    branches:
      - 'develop'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Check
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build
          pnpm run test
      - name: Check the generated API types are up to date
        run: |
          pnpm run generate:api-types
          if ! git diff --exit-code -- packages/shared/src/api-types/generated; then
            echo "::error::The API types are out of date. Run pnpm generate:api-types and commit the result."
            exit 1
          fi
