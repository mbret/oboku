name: deploy-docker-image

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit to build the image from'
        required: true
        type: string
      tags:
        description: 'Tags to push the image under, one per line (e.g. latest)'
        required: true
        type: string
      target:
        description: 'Dockerfile stage to build, pushed as mbret/oboku-<target>'
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE: mbret/oboku-${{ inputs.target }}

jobs:
  build:
    name: 'Build ${{ matrix.arch }}'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: dockerfile
          target: ${{ inputs.target }}
          build-args: |
            GITHUB_SHA=${{ inputs.sha }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 'Merge'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.target }}-*
          merge-multiple: true

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo 'tags<<EOF'
            for tag in $TAGS; do
              echo "$IMAGE:$tag"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          args=()
          for image_tag in $IMAGE_TAGS; do
            args+=(--tag "$image_tag")
          done
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          for image_tag in $IMAGE_TAGS; do
            docker buildx imagetools inspect "$image_tag"
          done
