[couchdb]
single_node=true

[chttpd]
authentication_handlers = {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, default_authentication_handler}
bind_address = 0.0.0.0
enable_cors = true

[cors]
origins = *
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, HEAD, POST, PUT, DELETE, OPTIONS

[couch_peruser]
enable=true
; With CouchDB's default delete_dbs=false, couch_peruser edits the security of
; a deleted user's database and crashes when that database is already gone,
; which is always the case after an oboku account deletion. It then restarts,
; replays _users from the beginning, hits the same deleted user and never
; provisions another database. https://github.com/apache/couchdb/issues/6086
delete_dbs=true
